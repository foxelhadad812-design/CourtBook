name: .NET Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CourtBook.slnx

      - name: Build
        run: dotnet build CourtBook.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CourtBook.slnx --configuration Release --no-build --logger "console;verbosity=normal"
