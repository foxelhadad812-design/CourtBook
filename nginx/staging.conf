# ==============================================================================
# CourtBook (PlaySpot) — Nginx Staging Reverse Proxy Configuration
# ==============================================================================

upstream staging_api_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream staging_web_upstream {
    server 127.0.0.1:5100;
    keepalive 32;
}

# HTTP Redirection to HTTPS
server {
    listen 80;
    server_name <STAGING_WEB_HOSTNAME> <STAGING_API_HOSTNAME>;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# Staging API (https://<STAGING_API_HOSTNAME>)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name <STAGING_API_HOSTNAME>;

    ssl_certificate     /etc/ssl/certs/<STAGING_TLS_CERT>.crt;
    ssl_certificate_key /etc/ssl/private/<STAGING_TLS_CERT>.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Forwarded Headers for ASP.NET Core UseForwardedHeaders()
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST Endpoints
    location / {
        proxy_pass http://staging_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SignalR WebSockets (/hubs/*)
    location /hubs/ {
        proxy_pass http://staging_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Public Liveness Probe
    location = /health {
        proxy_pass http://staging_api_upstream/health;
    }

    # Public Readiness Probe
    location = /health/ready {
        proxy_pass http://staging_api_upstream/health/ready;
    }

    # Protected Diagnostics Probe (Access restricted)
    location = /health/details {
        proxy_pass http://staging_api_upstream/health/details;
    }
}

# ------------------------------------------------------------------------------
# Staging Web (https://<STAGING_WEB_HOSTNAME>)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name <STAGING_WEB_HOSTNAME>;

    ssl_certificate     /etc/ssl/certs/<STAGING_TLS_CERT>.crt;
    ssl_certificate_key /etc/ssl/private/<STAGING_TLS_CERT>.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://staging_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
